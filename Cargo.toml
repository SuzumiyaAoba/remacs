[workspace]
members = ["crates/runtime", "crates/libraries", "crates/cli", "crates/gui"]
exclude = ["vendor/gpui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
remacs-runtime = { path = "crates/runtime" }
remacs-libraries = { path = "crates/libraries" }
remacs-cli = { path = "crates/cli", default-features = false }
remacs-gui = { path = "crates/gui" }
crossterm = "0.29.0"
gpui = { path = "vendor/gpui", version = "0.2.2", features = ["runtime_shaders"] }
smol = "2.0.2"
num-bigint = "0.4.8"
num-integer = "0.1.46"
num-rational = "0.4.2"
num-traits = "0.2.19"
base64 = "0.22.1"
corosensei = "0.3.4"
flate2 = "1.1.5"
html5ever = "0.39"
indexmap = "2.14.2"
libc = "0.2.189"
markup5ever_rcdom = "0.39.0"
md-5 = "0.10.6"
quick-xml = "0.38"
rusqlite = { version = "0.40.2", features = ["bundled", "load_extension"] }
sha1 = "0.10.6"
sha2 = "0.10.8"
sha3 = "0.10.8"
tree-sitter = "0.25.10"
tree-sitter-language = "0.1.8"
libloading = "0.8.9"
unicode-width = "0.2.2"
unicode-bidi = "0.3.18"
unicode_names2 = "4.0.0"
rustc-hash = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[package]
name = "remacs"
version.workspace = true
edition.workspace = true
default-run = "remacs"

[features]
default = ["gui"]
gui = ["dep:remacs-gui"]

[dependencies]
remacs-runtime.workspace = true
remacs-cli = { workspace = true, features = ["terminal"] }
remacs-gui = { workspace = true, optional = true }

[dev-dependencies]
libc.workspace = true
serde_json.workspace = true

# Keep interpreter startup practical in development and tests.
[profile.dev]
opt-level = 1
