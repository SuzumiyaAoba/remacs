[package]
name = "remacs"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
crossterm = "0.29.0"
flate2 = "1.1.5"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
html5ever = "0.39"
indexmap = "2.14.2"
libc = "0.2.189"
markup5ever_rcdom = "0.39.0"
md-5 = "0.10.6"
quick-xml = "0.38"
rusqlite = { version = "0.40.2", features = ["bundled", "load_extension"] }
sha1 = "0.10.6"
sha2 = "0.10.8"
sha3 = "0.10.8"
smol = "2.0.2"
tree-sitter = "0.25.10"
tree-sitter-language = "0.1.8"
libloading = "0.8.9"
unicode-width = "0.2.2"
unicode_names2 = "4.0.0"
rustc-hash = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders", "test-support"] }

# The interpreter spends its time in eval loops; an unoptimized debug
# build pays ~6x on every `Interp::new' (~17s of prelude+libraries per
# batch run / test Interp).  opt-level 1 keeps debug info and compile
# times reasonable while making dev runs usable.
[profile.dev]
opt-level = 1
